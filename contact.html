<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/Wcolorlog.png" type="image/png">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>

<body>
    <nav class="topnav">
        <a class="brand" href="index.html">Koenigsegg</a>
        <a href="index.html">Home</a>
        <a href="news.html">News</a>
        <a class="active" href="contact.html">Contact</a>
        <a href="about.html">About</a>
    </nav>

    <div class="content">
        <div class="card-form">
            <h2>Contact / Registration</h2>
            <p>Fill out the form to sign in or register your details.</p>
            <form id="userForm" action="formAction.html" method="get">
                <label for="nome">Full name</label>
                <input type="text" id="nome" name="nome" placeholder="Your full name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <div class="row">
                    <div class="col-ddd">
                        <label for="ddd">DDD</label>
                        <input type="tel" id="ddd" name="ddd" inputmode="numeric" pattern="[0-9]{2}" maxlength="2"
                            placeholder="11" required>
                    </div>
                    <div class="col-phone">
                        <label for="cel">Mobile</label>
                        <input type="tel" id="cel" name="cel" inputmode="numeric" pattern="[0-9]{8,9}" maxlength="9"
                            placeholder="912345678" required>
                    </div>
                </div>

                <label for="nasc">Date of birth</label>
                <input type="date" id="nasc" name="nasc" required>

                <button type="submit" class="btn-submit">Sign In / Submit</button>
            </form>
        </div>
    </div>

    <script src="js/form.js"></script>
</body>
</html>
