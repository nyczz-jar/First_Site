<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/Wcolorlog.png" type="image/png">
    <title>Koenigsegg Store</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <script src="js/auth.js"></script>
    <script>
        // Verifica autenticação assim que a página começa a carregar
        requireAuth();
    </script>
    <style>
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .navbar-right .user-info {
            color: white;
            font-size: 13px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .navbar-right .btn-logout {
            background-color: #ff6b35;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .navbar-right .btn-logout:hover {
            background-color: #e55a2b;
        }
    </style>
</head>

<body>
    <!-- Menu no topo -->
    <nav class="topnav" role="navigation" aria-label="Main navigation">
        <a class="brand" href="index.html">Koenigsegg</a>
        <a class="active" href="index.html">Home</a>
        <a href="news.html">News</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About</a>
        <div class="navbar-right">
            <div class="user-info" id="userInfo"></div>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <!-- Aqui define o conteúdo da página principal -->
    <div class="content">
        <h1 class="titleTop">Catalog</h1>
        <div class="first">
            <div class="menu">
                <img class="imgStamp" src="img/catalogo01.jpg" alt="Koenigsegg Gemera">
                <p class="caption">Koenigsegg Gemera</p>
                <button class="modalButton" type="button" id="Koenig1Button">More...</button>
            </div>
            <div class="menu">
                <img class="imgStamp" src="img/catalogo02.jpg" alt="Koenigsegg Jesko Sadair's Spear">
                <p class="caption">Koenigsegg Jesko Sadair's Spear</p>
                <button class="modalButton" type="button" id="Koenig2Button">More...</button>
            </div>
            <div class="menu">
                <img class="imgStamp" src="img/catalogo03.jpg" alt="Koenigsegg Agera RS Carbon Edition">
                <p class="caption">Koenigsegg Agera RS Carbon Edition</p>
                <button class="modalButton" type="button" id="Koenig3Button">More...</button>
            </div>
        </div>
        <div class="second">
            <div class="menu">
                <img class="imgStamp" src="img/catalogo04.jpg" alt="Koenigsegg CCX">
                <p class="caption">Koenigsegg CCX</p>
                <button class="modalButton" type="button" id="Koenig4Button">More...</button>
            </div>
            <div class="menu">
                <img class="imgStamp" src="img/catalogo05.jpg" alt="Koenigsegg One:1">
                <p class="caption">Koenigsegg One:1</p>
                <button class="modalButton" type="button" id="Koenig5Button">More...</button>
            </div>
            <div class="menu">
                <img class="imgStamp" src="img/catalogo06.jpg" alt="Koenigsegg Gemera">
                <p class="caption">Koenigsegg Gemera</p>
                <button class="modalButton" type="button" id="Koenig6Button">More...</button>
            </div>
        </div>
    </div>

    <!-- Modal Detalhes -->
    <div id="knowMore" class="modal" role="dialog" aria-modal="true" aria-labelledby="txt1" aria-describedby="txt2" tabindex="-1">
        <header>
            <button id="closeModalButton" class="topright" aria-label="Close">X</button>
        </header>
        <div>
            <p id="txt1" class="infoH"></p>
            <p id="txt2" class="info"></p>
            <p id="txt3" class="info"></p>
            <p id="txt4" class="info"></p>
        </div>
    </div>

    <!-- Referência ao arquivo Javascript -->
    <script src="js/main.js"></script>
    <script>
        // Exibe informações do usuário logado
        document.addEventListener('DOMContentLoaded', function() {
            const auth = getAuth();
            const userInfo = document.getElementById('userInfo');
            if (auth && userInfo) {
                userInfo.textContent = 'Olá, ' + (auth.email.split('@')[0] || auth.email);
            }
        });

        // Função de logout
        function handleLogout() {
            if (confirm('Tem certeza que deseja fazer logout?')) {
                logout();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
