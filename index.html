<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/Wcolorlog.png" type="image/png">
    <title>Koenigsegg Store</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>

<body>
    <!-- Menu no topo -->
    <nav class="topnav">
        <a class="brand" href="index.html">Koenigsegg</a>
        <a class="active" href="index.html">Home</a>
        <a href="news.html">News</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About</a>
    </nav>

    <!-- Aqui que define o conteúdo da página principal -->
    <div class="content">
        <h1 class="titleTop">Catalog</h1>
        <div class="first">
            <div class="menu">
                <img class="imgStamp" src="img/catalogo01.jpg">
                <p class="caption">Koenigsegg Gemera</p>
                <input class="modalButton" type="button" value="More..." id="Koenig1Button">
            </div>
            <div class="menu">
                <img class="imgStamp" src="img/catalogo02.jpg">
                <p class="caption">Koenigsegg Jesko Sadair's Spear</p>
                <input class="modalButton" type="button" value="More..." id="Koenig2Button">
            </div>
            <div class="menu">
                <img class="imgStamp" src="img/catalogo03.jpg">
                <p class="caption">Koenigsegg Agera RS Carbon Edition</p>
                <input class="modalButton" type="button" value="More..." id="Koenig3Button">
            </div>
        </div>
        <div class="second">
            <div class="menu">
                <img class="imgStamp" src="img/catalogo04.jpg">
                <p class="caption">Koenigsegg CCX</p>
                <input class="modalButton" type="button" value="More..." id="Koenig4Button">
            </div>
            <div class="menu">
                <img class="imgStamp" src="img/catalogo05.jpg">
                <p class="caption">Koenigsegg One:1</p>
                <input class="modalButton" type="button" value="More..." id="Koenig5Button">
            </div>
            <div class="menu">
                <img class="imgStamp" src="img/catalogo06.jpg">
                <p class="caption">Koenigsegg Gemera</p>
                <input class="modalButton" type="button" value="More..." id="Koenig6Button">
            </div>
        </div>
    </div>

    <!-- Modal Detalhes -->
    <div id="knowMore" class="modal">
        <header>
            <span id="closeModalButton" class="topright">X</span>
        </header>
        <div>
            <p id="txt1" class="infoH"></p>
            <p id="txt2" class="info"></p>
            <p id="txt3" class="info"></p>
            <p id="txt4" class="info"></p>
        </div>
    </div>

    <!-- Referência ao arquivo Javascript -->
    <script src="js/main.js"></script>
    <script src="js/form.js"></script>
    <script src="js/modal.js"></script>
</body>
</html>
