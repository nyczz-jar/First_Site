<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Carros - Koenigsegg</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <style>
        .manage-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
        }

        .form-container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #ff6b35;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b35, #ff5722);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn-secondary {
            background: #e6e6e6;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            background: #c0392b;
            color: white;
        }

        .btn-danger:hover {
            background: #a0321f;
        }

        .btn-edit {
            background: #3498db;
            color: white;
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .btn-delete {
            background: #c0392b;
            color: white;
            padding: 6px 10px;
            font-size: 12px;
            margin-left: 5px;
        }

        .btn-delete:hover {
            background: #a0321f;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .cars-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .cars-table th {
            background: #333;
            color: white;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
        }

        .cars-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #e6e6e6;
        }

        .cars-table tbody tr:hover {
            background: #f9f9f9;
        }

        .cars-table tbody tr:last-child td {
            border-bottom: none;
        }

        .actions-cell {
            white-space: nowrap;
        }

        .no-cars {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff6b35;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Menu no topo -->
    <nav class="topnav" role="navigation" aria-label="Main navigation">
        <a class="brand" href="index.html">Koenigsegg</a>
        <a href="index.html">Home</a>
        <a href="news.html">News</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About</a>
        <div class="navbar-right">
            <div class="user-info" id="userInfo"></div>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <div class="manage-content">
        <h1 class="section-title">Gerenciar Catálogo de Carros</h1>

        <!-- Alertas -->
        <div id="alert" class="alert"></div>

        <!-- Formulário de Criar/Editar -->
        <div class="form-container">
            <h2 style="margin-top: 0; margin-bottom: 20px; font-size: 18px;">Adicionar/Editar Carro</h2>
            <form id="carForm">
                <input type="hidden" id="carId" value="">

                <div class="form-row">
                    <div class="form-group">
                        <label for="modelo">Modelo *</label>
                        <input type="text" id="modelo" name="modelo" placeholder="Ex: Koenigsegg Regera" required>
                    </div>
                    <div class="form-group">
                        <label for="ano">Ano *</label>
                        <input type="number" id="ano" name="ano" placeholder="Ex: 2020" min="1900" max="2100" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="preco">Preço (R$) *</label>
                        <input type="number" id="preco" name="preco" placeholder="Ex: 3700000.00" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="potencia">Potência (HP) *</label>
                        <input type="number" id="potencia" name="potencia" placeholder="Ex: 1500" min="0" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Adicionar Carro</button>
                    <button type="button" class="btn btn-secondary" id="resetBtn" onclick="resetForm()">Limpar</button>
                </div>
            </form>
        </div>

        <!-- Tabela de Carros -->
        <h2 style="margin-bottom: 20px; font-size: 18px;">Carros Cadastrados</h2>
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            Carregando carros...
        </div>
        <table class="cars-table" id="carsTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Preço (R$)</th>
                    <th>Potência (HP)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="carsTableBody">
            </tbody>
        </table>
        <div id="noCars" class="no-cars" style="display: none;">
            Nenhum carro cadastrado.
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Verifica autenticação
        requireAuth();

        const API_BASE = 'api';
        const carForm = document.getElementById('carForm');
        const carIdInput = document.getElementById('carId');
        const modeloInput = document.getElementById('modelo');
        const anoInput = document.getElementById('ano');
        const precoInput = document.getElementById('preco');
        const potenciaInput = document.getElementById('potencia');
        const submitBtn = document.getElementById('submitBtn');
        const alertDiv = document.getElementById('alert');
        const carsTable = document.getElementById('carsTable');
        const carsTableBody = document.getElementById('carsTableBody');
        const noCars = document.getElementById('noCars');
        const loading = document.getElementById('loading');

        // Carrega os dados do usuário
        document.addEventListener('DOMContentLoaded', function() {
            const auth = getAuth();
            const userInfo = document.getElementById('userInfo');
            if (auth && userInfo) {
                userInfo.textContent = 'Olá, ' + (auth.email.split('@')[0] || auth.email);
            }
            loadCars();
        });

        // Carrega lista de carros
        async function loadCars() {
            loading.style.display = 'block';
            carsTable.style.display = 'none';
            noCars.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/getCars.php`);
                const text = await response.text();

                // Tenta interpretar como JSON. Se falhar, mostra o texto de erro do servidor.
                let data = null;
                try {
                    data = JSON.parse(text);
                } catch (err) {
                    console.error('Resposta não-JSON do servidor:', text);
                    showAlert(text || 'Resposta inesperada do servidor', 'error');
                    noCars.style.display = 'block';
                    return;
                }

                if (!response.ok || (data && data.success === false)) {
                    showAlert(data.message || 'Erro ao carregar carros', 'error');
                    noCars.style.display = 'block';
                    return;
                }

                if (data.success && data.cars && data.cars.length > 0) {
                    renderCarsTable(data.cars);
                    carsTable.style.display = 'table';
                } else {
                    noCars.style.display = 'block';
                }
            } catch (error) {
                console.error('Erro ao carregar carros:', error);
                showAlert('Erro ao carregar carros', 'error');
            } finally {
                loading.style.display = 'none';
            }
        }

        // Renderiza tabela de carros
        function renderCarsTable(cars) {
            carsTableBody.innerHTML = '';
            cars.forEach(car => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${car.id}</td>
                    <td>${escapeHtml(car.modelo)}</td>
                    <td>${car.ano}</td>
                    <td>R$ ${parseFloat(car.preco).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                    <td>${car.potencia} HP</td>
                    <td class="actions-cell">
                        <button type="button" class="btn btn-edit" onclick="editCar(${car.id}, '${escapeHtml(car.modelo)}', ${car.ano}, ${car.preco}, ${car.potencia})">Editar</button>
                        <button type="button" class="btn btn-delete" onclick="deleteCar(${car.id})">Deletar</button>
                    </td>
                `;
                carsTableBody.appendChild(row);
            });
        }

        // Submissão do formulário
        carForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const carId = carIdInput.value;
            const modelo = modeloInput.value.trim();
            const ano = parseInt(anoInput.value);
            const preco = parseFloat(precoInput.value);
            const potencia = parseInt(potenciaInput.value);

            if (!modelo || !ano || !preco || !potencia) {
                showAlert('Preencha todos os campos obrigatórios', 'error');
                return;
            }

            const endpoint = carId ? 'updateCar.php' : 'createCar.php';
            const method = carId ? 'PUT' : 'POST';
            const payload = {
                modelo,
                ano,
                preco,
                potencia
            };

            if (carId) payload.id = parseInt(carId);

            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/${endpoint}`, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    showAlert(carId ? 'Carro atualizado com sucesso!' : 'Carro adicionado com sucesso!', 'success');
                    resetForm();
                    loadCars();
                } else {
                    showAlert(data.message || 'Erro ao salvar carro', 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro ao conectar com o servidor', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Edita um carro
        function editCar(id, modelo, ano, preco, potencia) {
            carIdInput.value = id;
            modeloInput.value = modelo;
            anoInput.value = ano;
            precoInput.value = preco;
            potenciaInput.value = potencia;
            submitBtn.textContent = 'Atualizar Carro';
            modeloInput.focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Deleta um carro
        async function deleteCar(id) {
            if (!confirm('Tem certeza que deseja deletar este carro?')) return;

            try {
                const response = await fetch(`${API_BASE}/deleteCar.php`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Carro deletado com sucesso!', 'success');
                    loadCars();
                } else {
                    showAlert(data.message || 'Erro ao deletar carro', 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro ao conectar com o servidor', 'error');
            }
        }

        // Limpa formulário
        function resetForm() {
            carIdInput.value = '';
            carForm.reset();
            submitBtn.textContent = 'Adicionar Carro';
        }

        // Mostra alerta
        function showAlert(message, type) {
            alertDiv.className = `alert ${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 3000);
            }
        }

        // Escapa HTML para prevenir XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Logout
        function handleLogout() {
            if (confirm('Tem certeza que deseja fazer logout?')) {
                logout();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
